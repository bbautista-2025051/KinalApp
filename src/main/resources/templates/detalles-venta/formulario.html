<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle Venta - Formulario')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<div class="main-content">
    <div class="topbar"><h1 th:text="${detalle.codigoDetalleVenta != null} ? 'Editar Detalle' : 'Nuevo Detalle'"></h1><a th:href="@{/detalles-venta}" class="btn btn-secondary">← Volver</a></div>
    <div class="page-content">
        <div class="card" style="max-width:600px;margin:auto">
            <form th:action="${detalle.codigoDetalleVenta == null} ? @{/detalles-venta} : @{/detalles-venta/actualizar/{id}(id=${detalle.codigoDetalleVenta})}" method="post">
                <div class="form-group"><label>Cantidad</label><input type="number" name="cantidad" th:value="${detalle.cantidad}" required class="form-control"></div>
                <div class="form-group"><label>Precio Unitario</label><input type="number" step="0.01" name="precioUnitario" th:value="${detalle.precioUnitario}" required class="form-control"></div>
                <div class="form-group"><label>Producto ID</label><input type="number" name="producto.codigoProducto" th:value="${detalle.producto.codigoProducto}" required class="form-control"></div>
                <div class="form-group"><label>Venta ID</label><input type="number" name="venta.codigoVenta" th:value="${detalle.venta.codigoVenta}" required class="form-control"></div>
                <div class="form-actions"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/detalles-venta}" class="btn btn-secondary">Cancelar</a></div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
