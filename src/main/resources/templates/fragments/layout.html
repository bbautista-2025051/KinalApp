<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="html">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | KinalApp'">KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>

<!-- SIDEBAR FRAGMENT -->
<aside class="sidebar" th:fragment="sidebar">
    <div class="sidebar-brand">
        <span>🏪</span>
        <span>KinalApp</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/}">
            <span class="icon">🏠</span>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/productos}">
            <span class="icon">📦</span>
            <span>Productos</span>
        </a>
        <a th:href="@{/clientes}">
            <span class="icon">👥</span>
            <span>Clientes</span>
        </a>
        <a th:href="@{/ventas}">
            <span class="icon">🧾</span>
            <span>Ventas</span>
        </a>
    </nav>
</aside>

<!-- MODAL ELIMINAR GLOBAL -->
<div th:fragment="deleteModal" id="deleteModal" class="modal-overlay">
    <div class="modal">
        <h3>⚠️ Confirmar eliminación</h3>
        <p>¿Estás seguro que deseas eliminar <strong id="deleteItemName">este registro</strong>?
           Esta acción no se puede deshacer.</p>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancelar</button>
            <button id="btnConfirmDelete" class="btn btn-danger">Sí, eliminar</button>
        </div>
    </div>
</div>

<div th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</div>
</html>
