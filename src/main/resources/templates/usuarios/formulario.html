<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario - Formulario')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<div class="main-content">
    <div class="topbar"><h1 th:text="${usuario.codigoUsuario != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></h1><a th:href="@{/usuarios}" class="btn btn-secondary">← Volver</a></div>
    <div class="page-content">
        <div class="card" style="max-width:600px;margin:auto">
            <form th:action="${usuario.codigoUsuario == null} ? @{/usuarios} : @{/usuarios/actualizar/{token}(token=${idToken})}" method="post">
                <div class="form-group"><label>Username</label><input type="text" name="username" th:value="${usuario.username}" required class="form-control"></div>
                <div class="form-group"><label>Email</label><input type="email" name="email" th:value="${usuario.email}" required class="form-control"></div>
                <div class="form-group"><label>Contraseña</label><input type="password" name="password" class="form-control" th:required="${usuario.codigoUsuario == null}"></div>
                <div class="form-group"><label>Rol</label>
                    <select name="rol" class="form-control"><option value="ADMIN" th:selected="${usuario.rol == 'ADMIN'}">ADMIN</option><option value="USER" th:selected="${usuario.rol == 'USER'}">USER</option></select>
                </div>
                <div class="form-group"><label>Estado</label>
                    <select name="estado" class="form-control"><option value="1" th:selected="${usuario.estado == 1}">Activo</option><option value="0" th:selected="${usuario.estado == 0}">Inactivo</option></select>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a></div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
