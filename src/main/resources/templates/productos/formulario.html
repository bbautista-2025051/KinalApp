<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Producto - Formulario')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<div class="main-content">
    <div class="topbar">
        <h1 th:text="${producto.codigoProducto != null} ? 'Editar Producto' : 'Nuevo Producto'"></h1>
        <a th:href="@{/productos}" class="btn btn-secondary">← Volver</a>
    </div>
    <div class="page-content">
        <div class="card" style="max-width:600px;margin:auto">
            <form th:action="${producto.codigoProducto == null} ? @{/productos} : @{/productos/actualizar/{token}(token=${idToken})}" method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" name="nombreProducto" th:value="${producto.nombreProducto}" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Precio (Q.)</label>
                    <input type="number" step="0.01" name="precio" th:value="${producto.precio}" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" name="stock" th:value="${producto.stock}" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select name="estado" class="form-control">
                        <option value="1" th:selected="${producto.estado == 1}">Activo</option>
                        <option value="0" th:selected="${producto.estado == 0}">Inactivo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
