<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main-content">
        <div class="page-header">
            <h1>Productos</h1>
            <div sec:authorize="hasAnyRole('ADMIN', 'USER')">
                <a th:href="@{/productos/nuevo}" class="btn btn-primary">+ Nuevo Producto</a>
            </div>
        </div>
        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>
        <div class="card">
            <table class="table">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.codigoProducto}"></td>
                    <td th:text="${p.nombreProducto}"></td>
                    <td>Q. <span th:text="${#numbers.formatDecimal(p.precio,1,2)}"></span></td>
                    <td th:text="${p.stock}"></td>
                    <td>
                        <span th:class="${p.estado == 1} ? 'badge badge-active' : 'badge badge-inactive'"
                              th:text="${p.estado == 1} ? 'Activo' : 'Inactivo'"></span>
                    </td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/productos/editar/{token}(token=${p.encryptedId})}" class="btn btn-secondary btn-sm">Editar</a>
                        <button class="btn btn-danger btn-sm btn-delete"
                                th:data-url="@{/productos/eliminar/{token}(token=${p.encryptedId})}"
                                th:data-name="${p.nombreProducto}">Eliminar</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="6">No hay productos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: deleteModal}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
