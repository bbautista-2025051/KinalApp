<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main-content">
        <div class="page-header">
            <h1>Clientes</h1>
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/clientes/nuevo}" class="btn btn-primary">+ Nuevo Cliente</a>
            </div>
        </div>
        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>
        <div class="card">
            <table class="table">
                <thead>
                <tr>
                    <th>DPI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.DPICliente}"></td>
                    <td th:text="${c.nombreCliente}"></td>
                    <td th:text="${c.apellidoCliente}"></td>
                    <td th:text="${c.direccion}"></td>
                    <td>
                        <span th:class="${c.estado == 1} ? 'badge badge-active' : 'badge badge-inactive'"
                              th:text="${c.estado == 1} ? 'Activo' : 'Inactivo'"></span>
                    </td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/clientes/editar/{token}(token=${c.encryptedId})}" class="btn btn-secondary btn-sm">Editar</a>
                        <button class="btn btn-danger btn-sm btn-delete"
                                th:data-url="@{/clientes/eliminar/{token}(token=${c.encryptedId})}"
                                th:data-name="${c.nombreCliente + ' ' + c.apellidoCliente}">Eliminar</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="6">No hay clientes registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: deleteModal}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
