<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cliente - Formulario')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<div class="main-content">
    <div class="topbar"><h1 th:text="${cliente.DPICliente != null} ? 'Editar Cliente' : 'Nuevo Cliente'"></h1><a th:href="@{/clientes}" class="btn btn-secondary">← Volver</a></div>
    <div class="page-content">
        <div class="card" style="max-width:600px;margin:auto">
            <form th:action="${cliente.DPICliente == null} ? @{/clientes} : @{/clientes/actualizar/{token}(token=${dpiToken})}" method="post">
                <div th:if="${cliente.DPICliente == null}" class="form-group"><label>DPI (13 dígitos)</label><input type="text" name="DPICliente" required maxlength="13" pattern="\d{13}" class="form-control"></div>
                <div class="form-group"><label>Nombre</label><input type="text" name="nombreCliente" th:value="${cliente.nombreCliente}" required class="form-control"></div>
                <div class="form-group"><label>Apellido</label><input type="text" name="apellidoCliente" th:value="${cliente.apellidoCliente}" required class="form-control"></div>
                <div class="form-group"><label>Dirección</label><input type="text" name="direccion" th:value="${cliente.direccion}" required class="form-control"></div>
                <div class="form-group"><label>Estado</label>
                    <select name="estado" class="form-control"><option value="1" th:selected="${cliente.estado == 1}">Activo</option><option value="0" th:selected="${cliente.estado == 0}">Inactivo</option></select>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a></div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
