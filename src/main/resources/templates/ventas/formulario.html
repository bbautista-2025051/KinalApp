<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Venta - Formulario')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<div class="main-content">
    <div class="topbar"><h1 th:text="${venta.codigoVenta != null} ? 'Editar Venta' : 'Nueva Venta'"></h1><a th:href="@{/ventas}" class="btn btn-secondary">← Volver</a></div>
    <div class="page-content">
        <div class="card" style="max-width:700px;margin:0 auto">
            <form th:action="${venta.codigoVenta == null} ? @{/ventas} : @{/ventas/actualizar/{token}(token=${idToken})}" method="post">
                <div class="form-group"><label>Cliente</label>
                    <select name="clienteDpi" class="form-control" required>
                        <option value="">-- Seleccionar --</option>
                        <option th:each="c : ${clientes}" th:value="${c.DPICliente}" th:text="${c.nombreCliente + ' ' + c.apellidoCliente + ' (' + c.DPICliente + ')'}" th:selected="${venta.cliente != null and venta.cliente.DPICliente == c.DPICliente}"></option>
                    </select>
                </div>
                <div class="form-group"><label>Usuario</label>
                    <select name="usuarioId" class="form-control" required>
                        <option value="">-- Seleccionar --</option>
                        <option th:each="u : ${usuarios}" th:value="${u.codigoUsuario}" th:text="${u.username + ' (' + u.rol + ')'}" th:selected="${venta.usuario != null and venta.usuario.codigoUsuario == u.codigoUsuario}"></option>
                    </select>
                </div>
                <div class="form-group"><label>Total (Q.)</label><input type="number" step="0.01" name="total" th:value="${venta.total}" required class="form-control"></div>
                <div class="form-group"><label>Estado</label>
                    <select name="estado" class="form-control"><option value="1" th:selected="${venta.estado == 1}">Activa</option><option value="0" th:selected="${venta.estado == 0}">Anulada</option></select>
                </div>
                <input type="hidden" name="fechaVenta" th:value="${venta.fechaVenta}"/>
                <div class="form-actions"><button type="submit" class="btn btn-primary">Guardar</button><a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a></div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
