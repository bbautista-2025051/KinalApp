<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Ventas')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main-content">
        <div class="page-header">
            <h1>Ventas</h1>
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/ventas/nuevo}" class="btn btn-primary">+ Nueva Venta</a>
            </div>
        </div>
        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>
        <div class="card">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${ventas}">
                    <td th:text="${v.codigoVenta}"></td>
                    <td th:text="${#dates.format(new java.util.Date(v.fechaVenta), 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${v.cliente.nombreCliente + ' ' + v.cliente.apellidoCliente}"></td>
                    <td>Q. <span th:text="${#numbers.formatDecimal(v.total,1,2)}"></span></td>
                    <td>
                            <span th:class="${v.estado == 1} ? 'badge badge-active' : 'badge badge-inactive'"
                                  th:text="${v.estado == 1} ? 'Activa' : 'Anulada'"></span>
                    </td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/ventas/editar/{token}(token=${v.encryptedId})}" class="btn btn-secondary btn-sm">Editar</a>
                        <button class="btn btn-danger btn-sm btn-delete"
                                th:data-url="@{/ventas/eliminar/{token}(token=${v.encryptedId})}"
                                th:data-name="'Venta #' + ${v.codigoVenta}">Eliminar</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ventas)}">
                    <td colspan="6">No hay ventas registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: deleteModal}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
