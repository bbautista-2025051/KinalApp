<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Ventas')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar}"></aside>
<div class="main-content">
    <div class="topbar">
        <h1>🧾 Gestión de Ventas</h1>
        <div class="topbar-actions">
            <a th:href="@{/ventas/nuevo}" class="btn btn-primary">➕ Nueva Venta</a>
        </div>
    </div>
    <div class="page-content">
        <div th:if="${successMsg}" class="alert alert-success" data-auto-close>✅ <span th:text="${successMsg}"></span></div>
        <div th:if="${errorMsg}" class="alert alert-danger" data-auto-close>❌ <span th:text="${errorMsg}"></span></div>
        <div class="card">
            <div class="card-header">
                <h2>Lista de Ventas</h2>
                <div class="search-bar" style="margin:0">
                    <input type="text" id="tableSearch" placeholder="🔍 Buscar venta..." />
                </div>
            </div>
            <div class="card-body" style="padding:0">
                <div th:if="${#lists.isEmpty(ventas)}" class="empty-state">
                    <div class="icon">🧾</div>
                    <p>No hay ventas registradas.</p>
                    <a th:href="@{/ventas/nuevo}" class="btn btn-primary" style="margin-top:16px">➕ Nueva Venta</a>
                </div>
                <div th:if="${not #lists.isEmpty(ventas)}" class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th><th>Fecha</th><th>Cliente</th><th>Usuario</th><th>Total</th><th>Estado</th><th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v : ${ventas}">
                                <td th:text="${v.codigoVenta}"></td>
                                <td th:text="${#dates.format(new java.util.Date(v.fechaVenta), 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${v.cliente != null} ? ${v.cliente.nombreCliente + ' ' + v.cliente.apellidoCliente} : 'N/A'"></td>
                                <td th:text="${v.usuario != null} ? ${v.usuario.username} : 'N/A'"></td>
                                <td>Q. <span th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></span></td>
                                <td>
                                    <span th:if="${v.estado == 1}" class="badge badge-active">Activa</span>
                                    <span th:if="${v.estado == 0}" class="badge badge-inactive">Anulada</span>
                                </td>
                                <td>
                                    <div style="display:flex;gap:6px">
                                        <a th:href="@{/ventas/editar/{id}(id=${v.codigoVenta})}"
                                           class="btn btn-warning btn-sm">✏️ Editar</a>
                                        <button class="btn btn-danger btn-sm btn-delete"
                                                th:data-url="@{/ventas/eliminar/{id}(id=${v.codigoVenta})}"
                                                th:data-name="${'Venta #' + v.codigoVenta}">
                                            🗑️ Eliminar
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div id="emptySearch" class="empty-state" style="display:none;padding:30px">
                        <p>No se encontraron resultados.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: deleteModal}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
