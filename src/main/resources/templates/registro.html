<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>📝 Crear Cuenta</h2>
            <p>Completa tus datos para registrarte</p>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <form class="login-form" th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="form-group">
                <label for="username">Nombre de usuario *</label>
                <input type="text" id="username" th:field="*{username}" class="form-control"
                       placeholder="usuario123" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico *</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" th:field="*{password}" class="form-control"
                       placeholder="••••••••" required>
            </div>

            <!-- Campos ocultos para rol y estado (se asignan en el controlador) -->
            <input type="hidden" th:field="*{rol}" value="USER">
            <input type="hidden" th:field="*{estado}" value="1">

            <button type="submit" class="btn-login">Registrarse</button>
        </form>

        <div class="login-footer">
            ¿Ya tienes cuenta? <a th:href="@{/login}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Inicia sesión</a>
            <br><br>
            &copy; 2026 KinalApp. Todos los derechos reservados.
        </div>
    </div>
</div>
</body>
</html>
